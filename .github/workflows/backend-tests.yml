name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "server.py"
      - "server_core.py"
      - "patched_server.py"
      - "test_server.py"
      - "test_provider_diagnostics.py"
      - "requirements.txt"
      - "data/**"
      - ".github/scripts/patch_gold_consultation.py"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "server.py"
      - "server_core.py"
      - "patched_server.py"
      - "test_server.py"
      - "test_provider_diagnostics.py"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Difetti Gold consultation patch
        run: |
          python .github/scripts/patch_gold_consultation.py
          if ! git diff --quiet -- server_core.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server_core.py
            git commit -m "Add secure Difetti Gold consultation endpoint"
            git push origin HEAD:main
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m unittest -v test_server.py test_provider_diagnostics.py
