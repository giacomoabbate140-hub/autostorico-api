name: Backend tests

on:
  push:
    branches: [main]
    paths:
      - "server.py"
      - "server_core.py"
      - "test_server.py"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "server.py"
      - "server_core.py"
      - "test_server.py"
      - "requirements.txt"
      - "data/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run backend tests
        run: python -m unittest -v test_server.py
