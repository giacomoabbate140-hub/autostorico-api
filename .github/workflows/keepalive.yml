name: Keep AutoStorico API awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          for attempt in 1 2 3 4; do
            if curl --fail --silent --show-error --max-time 45 \
              https://autostorico-api-1.onrender.com/health; then
              exit 0
            fi
            echo "Tentativo $attempt non riuscito: attendo prima di riprovare."
            sleep 30
          done
          exit 1
