name: Market hardening live verification
on:
  push:
    branches: [codex/market-bmw-diagnosis-20261006]
    paths: [.github/workflows/market-bmw-live-diagnosis.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify current users API with BMW and Audi
        run: |
          python - <<'PY'
          import json, time, urllib.request
          BASE = "https://autostorico-api-1.onrender.com"
          def request(path, payload=None):
              req = urllib.request.Request(BASE + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json", "User-Agent": "AutoStorico-Market-Verification/2"})
              with urllib.request.urlopen(req, timeout=150) as response:
                  return json.load(response)
          for attempt in range(24):
              if request("/health").get("marketSearchRevision") == "market_primary_advert_content_v20":
                  break
              time.sleep(15)
          else:
              raise SystemExit("v20 not deployed")
          failed = []
          vehicles = [
            {"vehicleType": "Auto", "brand": "BMW", "model": "Serie 1 120d",
             "firstRegistrationDate": "2011", "km": 158000, "fuelType": "Diesel", "engineDisplacement": 1995},
            {"vehicleType": "Auto", "brand": "Audi", "model": "A1",
             "firstRegistrationDate": "2011", "km": 190000, "fuelType": "Diesel", "engineDisplacement": 1598}]
          for vehicle in vehicles:
              result = request("/api/vehicle-value", {**vehicle, "gearbox": "Manuale",
                  "condition": "Buono", "previousOwners": "1 proprietario"})
              estimate = result.get("estimate", {})
              keys = ("serverOnline", "marketBased", "matchedListings", "sourcesUsed", "sampleListings",
                      "minValue", "maxValue", "confidence", "method", "directListings", "extrapolatedListings")
              print(json.dumps({"market": vehicle["brand"], "estimate": {key: estimate.get(key) for key in keys}}, ensure_ascii=False))
              diagnostics = request("/api/diagnostics/providers")
              selected = {name: {key: data.get(key) for key in ("lastStatus", "lastResults", "usedToday",
                    "lastMarketSearch", "elapsedMs")} for name, data in diagnostics.get("providers", {}).items()}
              print(json.dumps({"providersAfter": vehicle["brand"], "providers": selected}, ensure_ascii=False))
              if not estimate.get("serverOnline") or not estimate.get("marketBased") or not estimate.get("matchedListings"):
                  failed.append(vehicle["brand"])
          if failed:
              raise SystemExit("No comparable advert reached the estimate: " + ", ".join(failed))
          PY
