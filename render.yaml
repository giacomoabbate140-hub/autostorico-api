services:
  - type: web
    name: autostorico-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: AUTOSTORICO_API_KEY
        sync: false
      - key: AUTOSTORICO_API_HOST
        value: 0.0.0.0
      - key: AUTOSTORICO_PREMIUM_API_KEY
        sync: false
      - key: AUTOSTORICO_DEVELOPER_DEVICE_ID_HASH
        sync: false
      - key: GOOGLE_PLAY_SERVICE_ACCOUNT_FILE
        value: /etc/secrets/google-play-service-account.json
      - key: GOOGLE_PLAY_PACKAGE_NAME
        value: autostorico.myapp
      - key: GOOGLE_PLAY_SUBSCRIPTION_ID
        value: premium_6_mesi
      - key: GOOGLE_PLAY_DEFECTS_GOLD_PRODUCT_ID
        value: goldseimesi
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: GOOGLE_CSE_API_KEY
        sync: false
      - key: GOOGLE_CSE_ID
        sync: false
      - key: AUTOSTORICO_GOOGLE_CSE_ENABLED
        value: "0"
      - key: AUTOSTORICO_DEFECT_RESEARCH_API_KEY
        sync: false
      - key: AUTOSTORICO_DEFECT_RESEARCH_ENABLED
        value: "0"
